[package]
name = "yunxi-hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "YunXi 场所与展示 层"

[dependencies]
yunxi-base = { path = "../yunxi-base" }
yunxi-core = { path = "../yunxi-core" }
yunxi-engine = { path = "../yunxi-engine" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
cosmic-text = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
futures-util = { workspace = true }
flate2 = { workspace = true }
fancy-regex = { workspace = true }
fontdb = { workspace = true }
libc = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
termimad = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
urlencoding = { workspace = true }
ratex-parser = { workspace = true }
ratex-layout = { workspace = true }
ratex-types = { workspace = true }
ratex-render = { workspace = true }
mermaid-rs-renderer = { workspace = true }
resvg = { workspace = true }

[features]
# 测试夹具与测试态行为开关(终端探测固定路径、块标记线程局部等)也编给根包的测试用
testkit = []

[dev-dependencies]
yunxi-base = { path = "../yunxi-base", features = ["testkit"] }
yunxi-core = { path = "../yunxi-core", features = ["testkit"] }
yunxi-engine = { path = "../yunxi-engine", features = ["testkit"] }
